# Capsule_brain_v2_milestone11_repaired Workflow Add New Core Service With Persistence And Tests

## Action

Follow the add-new-core-service-with-persistence-and-tests workflow:
1. Define or update models in a new or existing models.py file.
2. Implement repository logic in repository.py (with SQLite or other storage).
3. Implement service logic in service.py or runner.py.
4. Wire up the new service in runtime/bootstrap.py and update configs/v2_runtime.yaml as needed.
5. Add or update __init__.py and supporting files in the new/existing module.
6. Write new unit tests in tests/unit/ (e.g., test_<feature>.py).
7. Update documentation or milestone tracking (e.g., MILESTONE_12.md).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/capsule_brain/<feature>/{models.py,repository.py,service.py,runner.py,__init__.py}, src/capsule_brain/runtime/bootstrap.py, configs/v2_runtime.yaml

